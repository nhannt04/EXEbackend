server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    # URL kết nối JDBC - Sử dụng environment variables cho security
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # Tối ưu hóa Connection Pool cho Serverless DB (Neon)
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
  
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
      
  jpa:
    hibernate:
      # Dùng 'validate' để cấu trúc database hoàn toàn được kiểm soát bởi Flyway migrations
      ddl-auto: validate
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_FORMAT_SQL:false}
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    # Cho phép tự động sửa đổi bảng qua các script SQL trong resources/db/migration
    locations: classpath:db/migration

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: "*"
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

# Tích hợp cấu hình Cloudflare R2 & JWT - Sử dụng environment variables
cloudflare:
  r2:
    account-id: ${CLOUDFLARE_R2_ACCOUNT_ID}
    access-key: ${CLOUDFLARE_R2_ACCESS_KEY}
    secret-key: ${CLOUDFLARE_R2_SECRET_KEY}
    bucket-name: ${CLOUDFLARE_R2_BUCKET_NAME:travel}
    endpoint: ${CLOUDFLARE_R2_ENDPOINT}
    custom-domain: ${CLOUDFLARE_R2_CUSTOM_DOMAIN:}

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000 # 15 phút (ms)
  refresh-expiration: 604800000 # 7 ngày (ms)

# Groq AI - Trip Planner
groq:
  api-key: ${GROQ_API_KEY:}
  model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  api-url: https://api.groq.com/openai/v1/chat/completions
  timeout-seconds: 30

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    org.hibernate.SQL: ${LOGGING_LEVEL_ORG_HIBERNATE_SQL:INFO}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOGGING_LEVEL_ORG_HIBERNATE_BINDER:INFO}
    org.flywaydb: ${LOGGING_LEVEL_ORG_FLYWAY:INFO}
