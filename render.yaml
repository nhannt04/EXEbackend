services:
  - type: web
    name: histra-backend
    env: docker
    plan: standard
    region: oregon
    
    # Port configuration
    ports:
      - port: 8080
    
    # Environment variables - thay thế với giá trị thực của bạn
    envVars:
      # Database (Neon PostgreSQL)
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://ep-square-wind-ap3lswph-pooler.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase: neondb_owner
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase: npg_GQe5K7gOTZLY
      
      # JWT Configuration
      - key: JWT_SECRET
        sync: false
        value: your_super_secret_jwt_key_with_at_least_256_bits_for_security_compliance
      
      # Cloudflare R2 Configuration
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        value: 77ff49f90fa9ef020620958ecff72334
      - key: CLOUDFLARE_R2_ACCESS_KEY
        value: 6925e127e37d5ee89fd492d0a5e237d3
      - key: CLOUDFLARE_R2_SECRET_KEY
        value: 37838c6a185e515c0c8c9cae135493a8eac230ac284b2560229ba3ba4d8477bc
      - key: CLOUDFLARE_R2_BUCKET_NAME
        value: travel
      - key: CLOUDFLARE_R2_ENDPOINT
        value: https://77ff49f90fa9ef020620958ecff72334.r2.cloudflarestorage.com
    
    # Health check
    healthCheck:
      path: /actuator/health
      interval: 30
      timeout: 10
      startPeriod: 40
      retries: 3
    
    # Build configuration
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/histra-backend-*.jar

