spring:
  datasource:
    # URL kết nối JDBC thực tế tới Neon PostgreSQL của bạn
    url: jdbc:postgresql://ep-square-wind-ap3lswph-pooler.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require
    username: neondb_owner
    password: npg_GQe5K7gOTZLY
    driver-class-name: org.postgresql.Driver
    # Tối ưu hóa Connection Pool cho Serverless DB (Neon)
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
  
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
      
  jpa:
    hibernate:
      # Dùng 'validate' để cấu trúc database hoàn toàn được kiểm soát bởi Flyway migrations
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    # Cho phép tự động sửa đổi bảng qua các script SQL trong resources/db/migration
    locations: classpath:db/migration

# Tích hợp cấu hình Cloudflare R2 & JWT (Có thể chỉnh sửa khi deploy production)
